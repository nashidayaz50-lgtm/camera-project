<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #333;
        }
        input[type="password"] {
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #444;
            margin-bottom: 15px;
            width: 200px;
            text-align: center;
            background: #222;
            color: #fff;
        }
        button {
            background-color: #00e676;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #00c853;
        }
    </style>
</head>
<body>

    <div class="login-card" id="loginOverlay">
        <h2>Admin Login</h2>
        <input type="password" id="passInput" placeholder="Password (12345)">
        <br>
        <button onclick="login()">Login</button>
        <p id="errMsg" style="color: #ff5252; display: none; margin-top: 10px; font-size: 13px;">Incorrect Password!</p>
    </div>

    <script>
        function login() {
            const pass = document.getElementById('passInput').value;
            if (pass === '12345') {
                // Redirect ya storage set karke dashboard par le jayein
                window.location.href = '/admin-dashboard.html'; // ya jo bhi aapka dashboard page ho
            } else {
                document.getElementById('errMsg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
